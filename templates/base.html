{% load i18n static %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description"
          content="{% trans 'Instituto Vak Advaita: cursos, libros y recursos de investigación.' %}">

    <title>{% block title %}Instituto Vak Advaita{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="flex min-h-screen flex-col">

    {% include "partials/navbar.html" %}

    <main id="main-content"
          class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">

        {% block content %}{% endblock %}

    </main>

    {% include "partials/footer.html" %}

    {% block extra_js %}{% endblock %}

</body>
</html>
